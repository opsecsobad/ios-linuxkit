# ios-linuxkit Debian edition (shipped by the app's rootfs overlay; app
# updates overwrite this file - put your own settings in ~/.tmux.conf).
#
# Phone cheat sheet (Ctrl = the on-screen Ctrl key, then the letter):
#   Ctrl-b c      new window          Ctrl-b n / p   next / previous window
#   Ctrl-b 1..9   go to window N      Ctrl-b d       detach (tmux keeps running)
#   tmux a        reattach later      swipe          scroll history
set -g mouse on
set -g history-limit 20000
set -g default-terminal "screen-256color"
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-right "#[fg=colour244]%H:%M "
setw -g window-status-current-style "fg=colour39,bold"
